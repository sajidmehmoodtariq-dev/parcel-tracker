<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcel Tracker - Home</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            color: white;
            max-width: 1100px;
            width: 92%;
            padding: 0 20px;
        }
        h1 {
            font-size: 68px;
            margin-bottom: 12px;
            margin-top: 0;
        }
        .subtitle {
            font-size: 28px;
            margin-bottom: 45px;
            opacity: 0.9;
        }
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 35px;
            margin-top: 35px;
        }
        .option-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 45px 30px;
            text-decoration: none;
            color: white;
            transition: transform 0.3s, background 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .option-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }
        .option-icon {
            font-size: 64px;
            margin-bottom: 18px;
        }
        .option-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 14px;
        }
        .option-desc {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.5;
        }
        .coming-soon {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .coming-soon:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.1);
        }
        .badge {
            display: inline-block;
            background: #f39c12;
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Parcel Tracker</h1>
        <p class="subtitle">Smart Logistics & Route Management System</p>
        
        <div class="options">
            <a href="/admin" class="option-card">
                <div class="option-icon">⚙️</div>
                <div class="option-title">Admin Dashboard</div>
                <div class="option-desc">Manage nodes, edges, and network infrastructure</div>
            </a>

            <a href="/route" class="option-card">
                <div class="option-icon">🗺️</div>
                <div class="option-title">Find Route</div>
                <div class="option-desc">Calculate shortest path between locations</div>
            </a>

            <div class="option-card coming-soon">
                <div class="option-icon">📮</div>
                <div class="option-title">Send Package</div>
                <div class="option-desc">Track and manage parcel deliveries</div>
                <span class="badge">Coming Soon</span>
            </div>
        </div>
    </div>
</body>
</html>
