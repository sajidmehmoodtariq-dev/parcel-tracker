<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcel Tracker - Route Finder</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 350px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
        }
        .section {
            background: #34495e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .section h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: none;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 10px;
        }
        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-link {
            background: transparent;
            color: #3498db;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        #map {
            flex: 1;
            height: 100vh;
        }
        .route-info {
            background: #1abc9c;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>📦 Route Finder</h1>
        
        <div class="section">
            <h3>Find Route</h3>
            <div class="form-group">
                <label>Start Location:</label>
                <select id="startNode">
                    <option value="">Select start node...</option>
                </select>
            </div>
            <div class="form-group">
                <label>End Location:</label>
                <select id="endNode">
                    <option value="">Select end node...</option>
                </select>
            </div>
            <button id="findRoute" class="btn btn-primary">Find Route</button>
            <button id="clearRoute" class="btn btn-danger">Clear Route</button>
            <div id="routeInfo"></div>
        </div>

        <div class="section">
            <h3>Block Road</h3>
            <div class="form-group">
                <label>Select Edge to Block/Unblock:</label>
                <select id="blockEdge">
                    <option value="">Select edge...</option>
                </select>
            </div>
            <button id="toggleBlock" class="btn btn-danger">Toggle Block</button>
        </div>

        <div class="section">
            <a href="/admin" class="btn btn-link">Admin Dashboard →</a>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app.js"></script>
</body>
</html>
